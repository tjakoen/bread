<!-- organisms/portfolio-frame — the PORTFOLIO's workspace chrome: the BREAD rail (site nav), the
     topbar (TJ's Desk brand + theme-cycle + light/dark toggles + ⌘K + presence), the assistant
     (the site-wide AI, chat form), and the AI console. It COMPOSES the grain shell primitives
     (side-rail / topbar / sidebar-panel / console); static markup — shell.js marks the current
     nav item with aria-current from the URL. Compose inside .app-shell, as a sibling of <main>. -->
<aside class="app-shell__rail side-rail">
  <div class="side-rail__brand"><b-icon sym="/assets/sprite.svg#spark"></b-icon><span>TJ's Desk</span></div>
  <a class="nav-item" href="/"><b-icon sym="/assets/sprite.svg#loop"></b-icon><span class="nav-item__label">Desk</span></a>
  <a class="nav-item" href="/notes"><b-icon sym="/assets/sprite.svg#knowledge"></b-icon><span class="nav-item__label">Notes</span></a>
  <a class="nav-item" href="/calendar"><b-icon sym="/assets/sprite.svg#traces"></b-icon><span class="nav-item__label">Calendar</span></a>
  <a class="nav-item" href="/mail"><b-icon sym="/assets/sprite.svg#send"></b-icon><span class="nav-item__label">Mail</span></a>

  <!-- BREAD Stack — a collapsible group (native <details>); its leaves are the sub-nav -->
  <details class="side-rail__group">
    <summary class="nav-item"><b-icon sym="/assets/sprite.svg#tasks"></b-icon><span class="nav-item__label">BREAD Stack</span><span class="nav-item__chev" aria-hidden="true">›</span></summary>
    <div class="side-rail__sub">
      <a class="nav-item" href="/batch"><span class="nav-item__label">BATCH</span></a>
      <a class="nav-item" href="/grain"><span class="nav-item__label">GRAIN</span></a>
      <a class="nav-item" href="/mill"><span class="nav-item__label">MILL</span></a>
    </div>
  </details>

  <div class="side-rail__spacer"></div>
  <a class="nav-item" href="/about"><b-icon sym="/assets/sprite.svg#settings"></b-icon><span class="nav-item__label">About</span></a>
</aside>

<header class="app-shell__topbar">
  <button class="icon-btn" data-variant="ghost" data-shell="rail-toggle" aria-label="Toggle navigation">
    <svg class="icon" aria-hidden="true" focusable="false"><use href="/assets/sprite.svg#menu"></use></svg>
  </button>
  <div class="topbar-ctl">
    <!-- theming controls: theme.js acts on these declaratively; the flavor list is on <html data-themes> -->
    <button class="icon-btn" data-variant="ghost" data-cycle-theme aria-label="Cycle theme"><span aria-hidden="true">◆</span></button>
    <button class="icon-btn" data-variant="ghost" data-toggle-scheme aria-label="Toggle light or dark"><span aria-hidden="true">◐</span></button>
    <b-kbd keys="⌘K"></b-kbd>
    <span class="presence"><b-icon sym="/assets/sprite.svg#spark" size="sm"></b-icon> Desk online</span>
  </div>
</header>

<aside class="app-shell__aside">
  <div class="assistant">
    <div class="assistant__head"><span>Assistant</span></div>
    <!-- the desk appends here over SSE (chat.send → your bubble + the streamed reply). Site-wide. -->
    <div class="assistant__log" data-surface="chat-log">
      <div class="chat-message" data-role="ai" data-grade="grain"><span class="chat-message__who">Desk</span><span class="chat-message__body">Ask me about TJ — or anything on this site.</span></div>
    </div>
    <div class="chat-thinking" data-thinking>
      <div class="chat-thinking__head">
        <span class="chat-thinking__who">✶ Desk · thinking</span>
        <button class="chat-thinking__toggle" data-shell="chat-toggle" type="button">↘ terminal</button>
      </div>
    </div>
    <div class="assistant__composer">
      <input type="text" placeholder="Ask the desk…" aria-label="Ask the desk"
             data-action="chat.send" data-target="chat-log" data-surface="chat-input">
      <button class="icon-btn" data-variant="ghost" data-action="chat.send" data-target="chat-log" data-from="chat-input" aria-label="Send">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="/assets/sprite.svg#send"></use></svg>
      </button>
    </div>
  </div>
</aside>

<section class="app-shell__console">
  <div class="console__box">
    <div class="console__bar">
      <button class="console__expand" data-shell="console-toggle" type="button" aria-label="Show or hide the desk's work">
        <b-icon sym="/assets/sprite.svg#spark" size="sm"></b-icon>
        <span class="console__label">the desk</span>
        <span class="console__acting">is acting…</span>
        <span class="console__chev" aria-hidden="true">▾</span>
      </button>
      <button class="console__toggle" data-shell="chat-toggle" type="button" aria-label="Switch between chat and terminal"></button>
    </div>
    <div class="console__feed" data-surface="console"></div>
  </div>
</section>

<div class="app-shell__scrim"></div>
