<!DOCTYPE html>
<html lang="en" data-themes="sourdough baguette brioche">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desk — PoC</title>
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/grain.css">
  <link rel="stylesheet" href="/components.css">
  <script type="module" src="/scripts/ai-dispatch.js"></script>
  <style>
    /* ── PoC ONLY (throwaway): proves the three desk-scene mechanisms — the tablet→workspace
       view-transition morph, the [data-lamp-origin] iris handoff, and the flat print-style
       object language (uniform hairlines, token palette, solid offset shadows, no blur).
       The real page ships these as portfolio components; nothing here is final art. ── */
    .desk { position: relative; min-height: 100vh; background: var(--paper-2); overflow: hidden; }
    .desk__eyebrow { position: absolute; top: 2rem; left: 3rem; right: 3rem;
      font-size: var(--text-xs); letter-spacing: 0.24em; color: var(--ink-muted);
      border-bottom: 1px solid var(--color-line); padding-bottom: 0.75rem; }
    .desk-object { position: absolute; display: block; text-decoration: none; color: var(--ink);
      background: var(--paper); border: 1px solid var(--ink);
      box-shadow: 2px 2px 0 var(--color-line); }              /* print-style offset shadow, no blur */
    .desk-object:hover { box-shadow: 3px 3px 0 var(--ink); }

    /* the paper — the ask line */
    .desk-paper { top: 18vh; left: 8vw; width: 34rem; padding: 2rem; transform: rotate(-1deg); }
    .desk-paper .ask { font-family: var(--font-accent); font-size: var(--text-lg);
      border-bottom: 1px solid var(--ink-faint); padding-bottom: 0.5rem; color: var(--ink-muted); }
    .desk-paper .chips { display: flex; gap: 0.5rem; margin-top: 1.25rem; flex-wrap: wrap; }
    .desk-paper .chip { font-size: var(--text-xs); border: 1px solid var(--ink-faint);
      border-radius: 999px; padding: 0.3rem 0.8rem; background: transparent; cursor: pointer; }

    /* the tablet — lies flat, its screen IS the workspace (view-transition morph target) */
    .desk-tablet { top: 14vh; right: 6vw; width: 30rem; padding: 0.9rem; border-radius: 1.1rem; transform: rotate(1.5deg); }
    .desk-tablet__screen { view-transition-name: workspace;   /* ← morphs into /dashboard's main pane */
      display: block; height: 19rem; background: var(--paper); border: 1px solid var(--color-line);
      overflow: hidden; }
    /* mini workspace drawn with the REAL shell classes, scaled — the screen shows the truth */
    .desk-tablet__mini { transform: scale(0.42); transform-origin: top left; width: 238%; height: 238%; pointer-events: none; }
    .desk-tablet__hint { display: block; text-align: center; font-size: var(--text-xs);
      color: var(--ink-muted); padding-top: 0.5rem; letter-spacing: 0.08em; }

    /* the physical lamp — dark at rest; its head is where the light wakes from */
    .desk-lamp { position: absolute; top: 6vh; left: 42vw; width: 13rem; height: 11rem; pointer-events: none; }
    .desk-lamp svg { width: 100%; height: 100%; stroke: var(--ink); fill: var(--paper); }

    /* sticky note */
    .desk-note { bottom: 12vh; left: 14vw; width: 11rem; height: 11rem; padding: 1rem;
      background: color-mix(in srgb, var(--color-accent, var(--paper)) 12%, var(--paper));
      transform: rotate(3deg); font-size: var(--text-sm); }
    .desk-note .t { font-family: var(--font-accent); display: block; margin-top: 0.4rem; }

    @media (prefers-reduced-motion: reduce) { .desk-object { transition: none; } }
  </style>
</head>
<body data-screen="desk" data-ai-transport="client">
  <main class="desk" data-surface="screen">
    <p class="desk__eyebrow">TJAKOEN STOLK — SOFTWARE ENGINEERING EDUCATOR · THE DESK (POC)</p>

    <!-- the physical lamp: the assistant's body. [data-lamp-origin] = where the light wakes from -->
    <div class="desk-lamp" aria-hidden="true">
      <svg viewBox="0 0 200 170">
        <ellipse cx="50" cy="150" rx="42" ry="10" stroke-width="2"/>
        <line x1="50" y1="150" x2="110" y2="60" stroke-width="2"/>
        <line x1="110" y1="60" x2="158" y2="98" stroke-width="2"/>
        <path d="M158 98 l34 -14 l12 30 l-34 14 z" stroke-width="2" data-lamp-origin></path>
      </svg>
    </div>

    <!-- the paper: the ask line (the chip posts a real Intent through the client door) -->
    <section class="desk-object desk-paper" data-surface="desk-paper">
      <div class="ask">Ask about TJ … ▌</div>
      <div class="chips">
        <button class="chip" type="button" data-action="demo.run" data-target="screen">what has he built?</button>
      </div>
    </section>

    <!-- the tablet: tap → the screen morphs into the real workspace (cross-document view transition) -->
    <a class="desk-object desk-tablet" href="/dashboard" data-surface="desk-tablet" aria-label="Open the workspace">
      <span class="desk-tablet__screen">
        <span class="desk-tablet__mini">
          <span style="display:block;height:2.4rem;border-bottom:1px solid var(--color-line);background:var(--paper-2)"></span>
          <span style="display:block;float:left;width:22%;height:14rem;border-right:1px solid var(--color-line);background:var(--paper-2)"></span>
          <span style="display:block;margin:1.2rem 1.2rem 0 26%;height:0.6rem;background:var(--color-line)"></span>
          <span style="display:block;margin:0.6rem 4rem 0 26%;height:0.6rem;background:var(--color-line)"></span>
          <span style="display:block;margin:1.2rem 2rem 0 26%;height:0.6rem;background:var(--color-line)"></span>
        </span>
      </span>
      <span class="desk-tablet__hint">TAP — ENTER THE WORKSPACE</span>
    </a>

    <!-- the sticky note (real latest-note title once server-rendered; static here — PoC) -->
    <a class="desk-object desk-note" href="/notes" data-surface="desk-note">
      latest note:
      <span class="t">“The browser grew up”</span>
    </a>
  </main>
</body>
</html>
